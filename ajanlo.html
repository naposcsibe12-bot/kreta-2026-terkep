<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384a"><title>Kréta 2026 · intelligens napi programajánló</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef2f4;color:#17212b}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}.head{background:#12384a;color:#fff;padding:16px}.head h1{font-size:20px;margin:0}.head p{font-size:11px;margin:5px 0 0;opacity:.9}.controls{padding:10px;border-bottom:1px solid #dde4e8}.row{display:flex;gap:6px;margin-bottom:6px}.row>*{flex:1}.controls select,.controls button{width:100%;padding:10px;border:1px solid #ccd5db;border-radius:9px;background:#fff;font-size:11px}.controls button.active{background:#12384a;color:#fff}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.days button{padding:8px 2px}.result{padding:10px}.summary{background:#eef5f7;border:1px solid #d5e4e9;border-radius:11px;padding:10px;margin-bottom:8px}.summary h2{font-size:14px;margin:0 0 4px}.summary p{font-size:10px;margin:3px 0}.card{border:1px solid #dde4e8;border-radius:11px;padding:10px;margin:7px 0}.card h3{font-size:13px;margin:0}.meta{font-size:10px;color:#61717a;margin:3px 0}.desc{font-size:10px;margin:5px 0}.score{font-weight:800;font-size:10px}.card button{margin-top:6px;padding:8px 10px;border:1px solid #ccd5db;border-radius:8px;background:#fff;font-weight:800;font-size:10px}.note{font-size:9px;color:#687780}.back{display:block;margin:10px;padding:10px;text-align:center;border:1px solid #ccd5db;border-radius:9px;text-decoration:none;color:#12384a;font-weight:800;font-size:11px}@media(max-width:500px){.app{width:100%}.days{grid-template-columns:repeat(7,1fr)}}</style></head><body><div class="app"><header class="head"><h1>✨ Intelligens napi programajánló</h1><p>A kiválasztott bázis, időjárási helyzet, autózási terhelés, időigény és const P=[
['Gouverneto–Katholiko',35.587,24.132,'culture','Kolymvari','sun','közepes','half','low','Kolostor, szurdok és barlangok'],['Lera-barlang',35.584,24.126,'nature','Kolymvari','sun','közepes','half','low','Katholiko környéki különleges kitérő'],['Agia Triada Tzagaroli',35.584,24.135,'culture','Kolymvari','rain','könnyű','short','low','Történelmi kolostor'],['Deliana-szurdok',35.452,23.754,'nature','Kolymvari','sun','közepes','half','medium','Kevésbé zsúfolt szurdok'],['Rokka',35.459,23.705,'culture','Kolymvari','sun','könnyű','short','medium','Sziklás hegyi falu'],['Diktamos-szurdok',35.405,24.083,'nature','Kolymvari','sun','közepes','half','medium','Zöld szurdok'],
['Anidri-szurdok',35.224,23.655,'nature','Chora Sfakion','sun','könnyű','short','medium','Rövid déli túra'],['Lissos',35.218,23.768,'culture','Chora Sfakion','sun','közepes','full','medium','Ősi hely gyalog vagy hajóval'],['Agia Irini-szurdok',35.329,23.812,'nature','Chora Sfakion','sun','közepes','half','medium','Samaria-alternatíva'],['Kallikratis',35.212,24.195,'culture','Chora Sfakion','sun','könnyű','short','medium','Hegyi falu'],['Rodakino',35.202,24.342,'beach','Chora Sfakion','sun','könnyű','half','low','Déli parti öblök'],['Myrthios',35.204,24.402,'culture','Chora Sfakion','sun','könnyű','short','low','Panorámás falu'],

['Erimoupoli',35.040,26.224,'beach','Sitia','sun','könnyű','half','medium','Xerokampos környéki öblök'],['Zíros-fennsík',35.117,26.089,'nature','Sitia','sun','könnyű','half','medium','Hegyi táj a délkeleti part felé'],['Koutsouras',35.040,25.949,'beach','Sitia','sun','könnyű','short','medium','Nyugodtabb délkeleti part'],['Kavoussi–Azoria',35.121,25.864,'culture','Sitia','sun','közepes','half','medium','Ősi település és olajfaligetek'],['Praisos',35.168,26.105,'culture','Sitia','sun','közepes','short','medium','Keleti régészeti hely'],['Chamaizi',35.215,26.025,'culture','Sitia','sun','közepes','short','low','Őskori lelőhely'],['Pefki-szurdok',35.047,25.997,'nature','Sitia','sun','közepes','half','medium','Zöld szurdok'],['Kato Zakros',35.096,26.264,'culture','Sitia','sun','könnyű','half','medium','Palota, öböl és falu'],['Xerokampos–Mazida Ammos',35.036,26.220,'beach','Sitia','sun','könnyű','half','medium','Ritkábban látogatott part'],
['Armeni',35.332,24.447,'culture','Rethymno','sun','könnyű','short','low','Mínószi kamrasírok'],['Mili-szurdok',35.340,24.509,'nature','Rethymno','sun','könnyű','half','low','Elhagyott falu és víz'],['Maroulas',35.346,24.585,'culture','Rethymno','sun','könnyű','short','low','Régi toronyházak'],['Sfendoni-barlang',35.302,24.823,'culture','Rethymno','rain','könnyű','short','medium','Jó rossz időre'],['Melidoni-barlang',35.366,24.735,'culture','Rethymno','rain','könnyű','short','low','Barlang és történelmi emlék'],['Anogeia',35.290,24.884,'culture','Rethymno','sun','könnyű','half','medium','Hegyi falu és pásztorkultúra'],['Zominthos',35.246,24.783,'culture','Rethymno','sun','könnyű','short','medium','Mínószi hegyi lelőhely'],['Fodele',35.401,24.950,'culture','Rethymno','rain','könnyű','short','low','Falu és kulturális program'],['Argyroupoli',35.284,24.337,'culture','Rethymno','rain','könnyű','half','low','Források, vízimalmok, tavernák'],['Arkadi',35.241,24.629,'culture','Rethymno','rain','könnyű','short','low','Kolostor'],['Eleftherna',35.343,24.630,'culture','Rethymno','sun','könnyű','half','low','Ókori város és múzeum'],['Margarites',35.344,24.688,'culture','Rethymno','rain','könnyű','half','low','Fazekasfalu'],['Rethymno óváros',35.369,24.473,'culture','Rethymno','rain','könnyű','half','low','Óváros és Fortezza']
];
let kind='mixed';document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.remove('active'));b.classList.add('active');recommend()});document.getElementById('go').onclick=recommend;['day','weather','drive','duration'].forEach(id=>document.getElementById(id).onchange=recommend);
function dist(a,b){const R=6371,r=Math.PI/180,la=a[0]*r,lb=b[0]*r,dlat=(b[0]-a[0])*r,dlon=(b[1]-a[1])*r,h=Math.sin(dlat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function score(p,base,w,dr,dur){let s=0;if(p[4]===base)s+=35;const km=dist(bc[base],[p[1],p[2]]);s+=Math.max(0,20-km/4);s+=p[5]===w?28:(w==='rain'&&p[5]==='rain'?20:0);s+=p[7]===dur?14:0;s+=p[8]===dr?14:dr==='low'&&p[8]==='high'?-12:0;if(kind!=='mixed')s+=p[3]===kind?25:-8;if(w==='rain'&&p[5]==='sun')s-=18;if(w==='rain'&&(p[3]==='nature'||p[3]==='beach'))s-=60;return s}
function recommend(){const d=+document.getElementById('day').value,base=bases[d],w=document.getElementById('weather').value,dr=document.getElementById('drive').value,dur=document.getElementById('duration').value;let candidates=P;if(w==='rain')candidates=candidates.filter(p=>p[3]!=='nature'&&p[3]!=='beach');let arr=candidates.map(p=>({p,s:score(p,base,w,dr,dur)})).sort((a,b)=>b.s-a.s);let chosen=[],cats={};for(const z of arr){if(chosen.length>=5)break;if(cats[z.p[3]]>=2)continue;chosen.push(z);cats[z.p[3]]=(cats[z.p[3]]||0)+1}let saved={};try{saved=JSON.parse(localStorage.getItem('kreta2026plan')||'{}')}catch(e){}let assigned=Object.entries(saved).filter(x=>x[1]==='D'+d).map(x=>x[0]);let html='<div class="summary"><h2>📅 D'+d+' · '+base+'</h2><p><b>Beállítás:</b> '+(w==='sun'?'jó idő':w==='rain'?'eső':'szél')+' · '+(dr==='low'?'kevés':dr==='medium'?'közepes':'sok')+' autózás · '+(dur==='short'?'1–2 óra':dur==='half'?'fél nap':'egész nap')+'</p><p><b>Aktuális terv:</b> '+(assigned.length?assigned.join(', '):'még nincs program')+'</p><p class="note">Az ajánló szabályalapú: közelséget, időjárási alkalmasságot, időigényt, autózási terhelést és programtípus-változatosságot mérlegel.</p></div>';chosen.forEach((z,i)=>{const p=z.p;const already=assigned.includes(p[0]);html+='<article class="card"><h3>'+['🥇','🥈','🥉','⭐','⭐'][i]+' '+p[0]+'</h3><div class="meta">'+p[4]+' · '+p[3]+' · ⏱️ '+p[7]+' · 🚗 '+(p[8]==='low'?'kevés':p[8]==='medium'?'közepes':'sok')+'</div><div class="desc">'+p[9]+'</div><div class="score">Ajánlási pont: '+Math.round(z.s)+'</div>'+(!already?'<button onclick="add('+JSON.stringify(p[0])+','+d+')">➕ Hozzáadás D'+d+'-hez</button>':'<button disabled>✓ Már a D'+d+' tervben</button>')+'</article>'});document.getElementById('result').innerHTML=html}
function add(name,d){let s={};try{s=JSON.parse(localStorage.getItem('kreta2026plan')||'{}')}catch(e){}s[name]='D'+d;localStorage.setItem('kreta2026plan',JSON.stringify(s));recommend()}
