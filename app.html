<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Kréta 2026 · Térkép, tervező és útvonal</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17212b;background:#eef2f4;overflow:hidden}header{height:58px;background:#12384a;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 2px 10px #0003;position:relative;z-index:30}h1{font-size:17px;margin:0;white-space:nowrap}.sub{font-size:10px;opacity:.8;margin-left:auto}.tabs{height:48px;background:#fff;border-bottom:1px solid #dce2e6;display:flex;gap:6px;padding:6px;position:relative;z-index:30}.tab{flex:1;border:1px solid #d4dce1;border-radius:10px;background:#fff;font-weight:800;font-size:11px;cursor:pointer;min-height:36px}.tab.active{background:#12384a;color:#fff;border-color:#12384a}.view{position:absolute;top:106px;bottom:0;left:0;right:0}.frame{width:100%;height:100%;border:0;display:none;background:#fff}.frame.active{display:block}.panel{position:absolute;z-index:25;left:12px;top:12px;width:410px;max-height:calc(100vh - 130px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px #0004;padding:11px}.panel h2{font-size:15px;margin:0 0 4px}.panel p{font-size:10px;color:#65727a;margin:3px 0 8px}.hint{background:#eef5f7;border-radius:8px;padding:8px;font-size:9px;margin-bottom:8px}.daybox{border:1px solid #dce2e6;border-radius:10px;padding:8px;margin:6px 0}.dayhead{display:flex;align-items:center;justify-content:space-between;gap:5px}.daybox b{font-size:11px}.start,.end{font-size:10px;font-weight:800;margin-top:5px}.poi{font-size:10px;margin:4px 0;padding-left:5px}.routebtn,.dayfull{display:inline-block;font-size:9px;text-decoration:none;border:1px solid #ccd5db;border-radius:7px;padding:6px 7px;color:#12384a;background:#fff;font-weight:800;margin-top:3px}.dayfull{background:#eef5f7}.empty{font-size:10px;color:#7a8790;padding:5px 0}.actions{display:flex;gap:5px;position:sticky;bottom:0;background:#fff;padding-top:7px}.actions button{flex:1;min-height:42px;border:1px solid #ccd5db;border-radius:9px;background:#fff;font-weight:800;font-size:10px}.actions button.primary{background:#12384a;color:#fff;border-color:#12384a}.mobilebar{display:none}
@media(max-width:700px){html,body{height:100dvh}.sub{display:none}header{height:52px;padding:7px 9px}h1{font-size:15px}.tabs{height:48px;padding:5px;gap:4px}.tab{font-size:10px;min-height:38px}.view{top:100px;bottom:0}.panel{left:0;right:0;top:0;width:auto;max-height:100%;height:100%;border-radius:0;padding:9px;padding-bottom:calc(70px + env(safe-area-inset-bottom));box-shadow:none}.panel h2{font-size:16px}.hint{font-size:10px}.daybox{padding:9px}.poi{font-size:11px}.routebtn,.dayfull{font-size:10px;min-height:40px;padding:9px}.actions{position:fixed;left:0;right:0;bottom:0;padding:7px 9px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0002}.actions button{min-height:46px;font-size:10px}.frame.active{height:100%}}
</style></head><body><header><h1>🇬🇷 Kréta 2026</h1><div class="sub">teljes látnivaló-adatbázis · rugalmas napitervező · szállástól induló útvonal</div></header><nav class="tabs" aria-label="Fő navigáció"><button class="tab active" id="mapTab" onclick="show('map')">🗺️ Térkép</button><button class="tab" id="planTab" onclick="show('plan')">🧭 Tervező</button><button class="tab" id="routeTab" onclick="show('route')">🚗 Útvonal</button></nav><main class="view"><iframe id="map" class="frame active" src="index.html" title="Kréta 2026 teljes térkép"></iframe><iframe id="plan" class="frame" src="tervezo.html" title="Kréta 2026 napitervező"></iframe><div id="route" class="frame"></div><section id="routebox" class="panel" aria-label="Napi útvonalterv"><h2>🚗 Napi útvonalterv</h2><div class="hint">Minden nap <b>az adott napi szállásbázistól indul</b>, a pontok sorrendben következnek, majd a nap végén vissza lehet navigálni a szálláshoz. D14 végén Chania repülőtér a végpont.</div><div id="routelist"></div><div class="actions"><button class="primary" onclick="refreshRoute()">🔄 Frissítés</button><button onclick="sharePlan()">📤 Megosztás</button><button onclick="exportPlan()">⬇️ Export</button></div></section></main><script>
const mapFrame=document.getElementById('map'),planFrame=document.getElementById('plan'),box=document.getElementById('routebox');
const bases={Kolymvari:[35.528,24.222],"Chora Sfakion":[35.199,24.137],Selakano:[35.093,25.544],Sitia:[35.2087,26.1052],Rethymno:[35.369,24.473]};
const dayBase={1:'Kolymvari',2:'Kolymvari',3:'Kolymvari',4:'Chora Sfakion',5:'Chora Sfakion',6:'Chora Sfakion',7:'Selakano',8:'Selakano',9:'Sitia',10:'Sitia',11:'Sitia',12:'Rethymno',13:'Rethymno',14:'Rethymno'};
const dates={1:'szept. 25.',2:'szept. 26.',3:'szept. 27.',4:'szept. 28.',5:'szept. 29.',6:'szept. 30.',7:'okt. 1.',8:'okt. 2.',9:'okt. 3.',10:'okt. 4.',11:'okt. 5.',12:'okt. 6.',13:'okt. 7.',14:'okt. 8.'};
function show(x){document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));if(x==='route'){mapFrame.classList.add('active');document.getElementById('routeTab').classList.add('active');box.classList.add('show');setTimeout(refreshRoute,80)}else{document.getElementById(x).classList.add('active');document.getElementById(x+'Tab').classList.add('active');box.classList.remove('show')}}
function getPlan(){try{return JSON.parse(localStorage.getItem('kreta2026plan')||'{}')}catch(e){return {}}}
function extract(){const saved=getPlan(),mp=mapFrame.contentWindow,pois=mp&&Array.isArray(mp.P)?mp.P:[],byName=new Map(pois.map(p=>[p[0],p])),out={};function walk(v,path){if(typeof v==='string'){const p=byName.get(v);if(p){const m=path.match(/(?:day|d)[ _-]?(\d{1,2})/i);const d=m?+m[1]:0;(out[d]??=[]).push(p)}return}if(Array.isArray(v)){v.forEach((x,i)=>walk(x,path+' '+i));return}if(v&&typeof v==='object')Object.keys(v).forEach(k=>walk(v[k],path+' '+k))}walk(saved,'');const raw=JSON.stringify(saved);if(Object.keys(out).length===0){pois.forEach(p=>{const i=raw.indexOf(JSON.stringify(p[0]).slice(1,-1));if(i>=0){const near=raw.slice(Math.max(0,i-100),i+100),m=near.match(/d(?:ay)?[^0-9]{0,4}(\d{1,2})/i);if(m)(out[+m[1]]??=[]).push(p)}})}Object.keys(out).forEach(k=>out[k]=[...new Map(out[k].map(p=>[p[0],p])).values()]);return out}
function navUrl(from,to){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(to)+'&travelmode=driving'}
function fullRouteUrl(base,pts,end){let parts=[base].concat(pts.map(p=>p[0]));if(end)parts.push(end);let origin=parts.shift(),destination=parts.pop()||origin;let u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+'&travelmode=driving';if(parts.length)u+='&waypoints='+encodeURIComponent(parts.join('|'));return u}
function refreshRoute(){const data=extract();let html='';for(let d=1;d<=14;d++){const base=dayBase[d],pts=data[d]||[];html+='<div class="daybox"><div class="dayhead"><b>D'+d+' · '+dates[d]+'</b><span class="meta">'+pts.length+' pont</span></div><div class="start">🏠 Indulás: '+base+'</div>';if(!pts.length){html+='<div class="empty">Még nincs hozzárendelt program.</div>'}else{let prev=base;pts.forEach((p,i)=>{const destination=p[0];html+='<div class="poi">'+(i+1)+'. 📍 <b>'+destination+'</b><br><a class="routebtn" target="_blank" rel="noopener" href="'+navUrl(prev,destination)+'">🧭 '+prev+' → '+destination+'</a></div>';prev=destination});if(d!==14){html+='<div class="end">🏠 Vissza a szálláshoz: '+base+'</div><a class="routebtn" target="_blank" rel="noopener" href="'+navUrl(prev,base)+'">↩️ '+prev+' → '+base+'</a>'}else{html+='<div class="end">✈️ Végpont: Chania repülőtér</div><a class="routebtn" target="_blank" rel="noopener" href="'+navUrl(prev,'Chania International Airport')+'">✈️ '+prev+' → Chania repülőtér</a>'}html+='<br><a class="dayfull" target="_blank" rel="noopener" href="'+fullRouteUrl(base,pts,d===14?'Chania International Airport':base)+'">🗺️ Teljes napi útvonal Google Mapsben</a>'}html+='</div>'}document.getElementById('routelist').innerHTML=html}
function exportPlan(){const data=getPlan();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kreta-2026-terv.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function sharePlan(){const text='Kréta 2026 – saját utazási terv\n'+location.href;if(navigator.share){try{await navigator.share({title:'Kréta 2026',text,url:location.href})}catch(e){}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(text);alert('A link a vágólapra került.')}catch(e){alert(text)}}else alert(text)}
mapFrame.addEventListener('load',()=>{if(box.classList.contains('show'))refreshRoute()});window.addEventListener('storage',e=>{if(e.key==='kreta2026plan'&&box.classList.contains('show'))refreshRoute()});
</script></body></html>
