<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>Kréta 2026 · útiterv</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef2f4;color:#17212b;overflow:hidden}header{height:54px;background:#12384a;color:#fff;display:flex;align-items:center;padding:7px 10px;gap:8px}h1{font-size:16px;margin:0}.sub{margin-left:auto;font-size:10px;opacity:.8}.tabs{height:48px;background:#fff;display:flex;gap:5px;padding:5px;border-bottom:1px solid #d9e0e4}.tab{flex:1;min-height:38px;border:1px solid #ccd5db;border-radius:9px;background:#fff;font-weight:800;font-size:10px;touch-action:manipulation}.tab.active{background:#12384a;color:#fff}.view{position:absolute;top:102px;bottom:0;left:0;right:0}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}.frame.active{display:block}.panel{position:absolute;z-index:20;display:none;left:10px;top:10px;width:430px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px #0004;padding:9px}.panel.show{display:block}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.panel h2{font-size:15px;margin:0}.hint{font-size:10px;background:#eef5f7;border-radius:8px;padding:8px;margin:7px 0}.daybox{border:1px solid #dce2e6;border-radius:10px;margin:6px 0;overflow:hidden}.dayhead{width:100%;border:0;background:#fff;padding:9px;text-align:left;display:flex;justify-content:space-between;font-weight:800;font-size:11px}.daybody{padding:0 9px 9px}.start,.end{font-size:10px;font-weight:800;margin:4px 0}.poi{font-size:10px;padding:5px 0;border-top:1px solid #edf0f2}.routebtn,.dayfull{display:inline-block;margin-top:4px;padding:7px 8px;border:1px solid #ccd5db;border-radius:7px;text-decoration:none;color:#12384a;font-size:9px;font-weight:800;background:#fff}.dayfull{background:#eef5f7}.empty{font-size:10px;color:#78858d;padding:6px 0}.badge{font-size:9px;color:#64727a}.actions{display:flex;gap:5px;position:sticky;bottom:0;background:#fff;padding-top:7px}.actions button{flex:1;min-height:42px;border:1px solid #ccd5db;border-radius:8px;background:#fff;font-weight:800;font-size:10px}.primary{background:#12384a!important;color:#fff}@media(max-width:700px){html,body{height:100dvh}.sub{display:none}.panel{left:0;right:0;top:0;width:auto;max-height:100%;height:100%;border-radius:0;box-shadow:none;padding:9px;padding-bottom:calc(66px + env(safe-area-inset-bottom))}.panel h2{font-size:16px}.hint{font-size:10px}.dayhead{min-height:44px;font-size:12px}.daybody{padding:0 10px 10px}.poi{font-size:11px}.routebtn,.dayfull{min-height:40px;padding:9px;font-size:10px}.actions{position:fixed;left:0;right:0;bottom:0;padding:7px 9px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0002}.actions button{min-height:46px;font-size:10px}}</style></head><body><header><h1>🇬🇷 Kréta 2026</h1><div class="sub">rugalmas tervező · mobilra optimalizálva</div></header><nav class="tabs"><button class="tab active" id="mapTab" onclick="show('map')">🗺️ Térkép</button><button class="tab" id="planTab" onclick="show('plan')">🧭 Tervező</button><button class="tab" id="routeTab" onclick="show('route')">🚗 Útvonal</button></nav><main class="view"><iframe id="map" class="frame active" src="index.html" title="Teljes térkép"></iframe><iframe id="plan" class="frame" src="tervezo.html" title="Napi tervező"></iframe><section id="routebox" class="panel"><div class="topline"><h2>🚗 Napi útvonal</h2><span id="count" class="badge"></span></div><div class="hint">A nap mindig az adott napi szállásbázistól indul. A kiválasztott pontokat a rendszer földrajzi közelség szerint rendezi, majd visszavisz a szálláshoz. D14 végpontja Chania repülőtér.</div><div id="routelist"></div><div class="actions"><button class="primary" onclick="refreshRoute()">🔄 Frissítés</button><button onclick="sharePlan()">📤 Megosztás</button><button onclick="exportPlan()">⬇️ Export</button></div></section></main><script>const mapFrame=document.getElementById('map'),box=document.getElementById('routebox');const bases={Kolymvari:[35.528,24.222],"Chora Sfakion":[35.199,24.137],Selakano:[35.093,25.544],Sitia:[35.2087,26.1052],Rethymno:[35.369,24.473]};const dayBase={1:'Kolymvari',2:'Kolymvari',3:'Kolymvari',4:'Chora Sfakion',5:'Chora Sfakion',6:'Chora Sfakion',7:'Selakano',8:'Selakano',9:'Sitia',10:'Sitia',11:'Sitia',12:'Rethymno',13:'Rethymno',14:'Rethymno'};const dates={1:'szept. 25.',2:'szept. 26.',3:'szept. 27.',4:'szept. 28.',5:'szept. 29.',6:'szept. 30.',7:'okt. 1.',8:'okt. 2.',9:'okt. 3.',10:'okt. 4.',11:'okt. 5.',12:'okt. 6.',13:'okt. 7.',14:'okt. 8.'};function show(x){document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));if(x==='route'){mapFrame.classList.add('active');routeTab.classList.add('active');box.classList.add('show');refreshRoute()}else{document.getElementById(x).classList.add('active');document.getElementById(x+'Tab').classList.add('active');box.classList.remove('show')}}function getPlan(){try{return JSON.parse(localStorage.getItem('kreta2026plan')||'{}')}catch(e){return {}}}function pois(){const p=mapFrame.contentWindow&&mapFrame.contentWindow.P;return Array.isArray(p)?p:[]}function extract(){const saved=getPlan(),all=pois(),by=new Map(all.map(p=>[p[0],p])),out={};function walk(v,path){if(typeof v==='string'){const p=by.get(v);if(p){const m=path.match(/(?:day|d)[ _-]?(\d{1,2})/i);if(m)(out[+m[1]]??=[]).push(p)}return}if(Array.isArray(v)){v.forEach((x,i)=>walk(x,path+' '+i));return}if(v&&typeof v==='object')Object.keys(v).forEach(k=>walk(v[k],path+' '+k))}walk(saved,'');Object.keys(out).forEach(k=>out[k]=[...new Map(out[k].map(p=>[p[0],p])).values()]);return out}function dist(a,b){const R=6371,r=Math.PI/180,la=a[0]*r,lb=b[0]*r,dlat=(b[0]-a[0])*r,dlon=(b[1]-a[1])*r,h=Math.sin(dlat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function optimize(base,pts){let cur=bases[base],left=pts.slice(),out=[];while(left.length){let bi=0,bd=Infinity;left.forEach((p,i)=>{const d=dist(cur,[p[1],p[2]]);if(d<bd){bd=d;bi=i}});const p=left.splice(bi,1)[0];out.push(p);cur=[p[1],p[2]]}return out}function nav(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode=driving'}function full(base,pts,end){const x=[base,...pts.map(p=>p[0]),end],o=x.shift(),d=x.pop()||o;let u=nav(o,d);if(x.length)u+='&waypoints='+encodeURIComponent(x.join('|'));return u}function refreshRoute(){const data=extract();let total=0,h='';for(let d=1;d<=14;d++){const base=dayBase[d],pts=optimize(base,data[d]||[]);total+=pts.length;h+='<article class="daybox"><button class="dayhead" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><span>D'+d+' · '+dates[d]+'</span><span>'+pts.length+' pont ▾</span></button><div class="daybody"'+(pts.length?'':' hidden')+'><div class="start">🏠 Indulás: '+base+'</div>';if(!pts.length)h+='<div class="empty">Még nincs hozzárendelt program.</div>';else{let prev=base;pts.forEach((p,i)=>{h+='<div class="poi">'+(i+1)+'. 📍 <b>'+p[0]+'</b><br><a class="routebtn" target="_blank" rel="noopener" href="'+nav(prev,p[0])+'">🧭 '+prev+' → '+p[0]+'</a></div>';prev=p[0]});const end=d===14?'Chania International Airport':base;h+='<div class="end">'+(d===14?'✈️ Végpont: Chania repülőtér':'🏠 Vissza: '+base)+'</div><a class="routebtn" target="_blank" rel="noopener" href="'+nav(prev,end)+'">'+(d===14?'✈️':'↩️')+' '+prev+' → '+end+'</a><br><a class="dayfull" target="_blank" rel="noopener" href="'+full(base,pts,end)+'">🗺️ Teljes napi útvonal</a></div></article>'}document.getElementById('routelist').innerHTML=h;document.getElementById('count').textContent=total+' kiválasztott pont'}function exportPlan(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(getPlan(),null,2)],{type:'application/json'}));a.download='kreta-2026-terv.json';a.click()}async function sharePlan(){if(navigator.share){try{await navigator.share({title:'Kréta 2026',text:'Kréta 2026 útiterv',url:location.href})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert('A link a vágólapra került.')}}if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));mapFrame.addEventListener('load',()=>{if(box.classList.contains('show'))refreshRoute()});window.addEventListener('storage',e=>{if(e.key==='kreta2026plan'&&box.classList.contains('show'))refreshRoute()});</script></body></html>
