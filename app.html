<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384a"><title>Kréta 2026 · Térkép, tervező és útvonal</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17212b;background:#eef2f4}header{height:58px;background:#12384a;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 2px 10px #0003;position:relative;z-index:20}h1{font-size:17px;margin:0;white-space:nowrap}.sub{font-size:10px;opacity:.8;margin-left:auto}.tabs{height:48px;background:#fff;border-bottom:1px solid #dce2e6;display:flex;gap:6px;padding:6px;position:relative;z-index:20}.tab{flex:1;border:1px solid #d4dce1;border-radius:10px;background:#fff;font-weight:800;font-size:11px;cursor:pointer}.tab.active{background:#12384a;color:#fff;border-color:#12384a}.view{position:absolute;top:106px;bottom:0;left:0;right:0}.frame{width:100%;height:100%;border:0;display:none;background:#fff}.frame.active{display:block}.panel{position:absolute;z-index:15;left:12px;top:12px;width:390px;max-height:calc(100vh - 130px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px #0004;padding:11px;display:none}.panel.show{display:block}.panel h2{font-size:15px;margin:0 0 4px}.panel p{font-size:10px;color:#65727a;margin:3px 0 8px}.daybox{border:1px solid #dce2e6;border-radius:9px;padding:8px;margin:6px 0}.daybox b{font-size:11px}.start{font-size:10px;font-weight:800;margin-top:4px}.poi{font-size:10px;margin:4px 0;padding-left:5px}.routebtn{display:inline-block;font-size:9px;text-decoration:none;border:1px solid #ccd5db;border-radius:6px;padding:4px 6px;color:#12384a;background:#fff}.empty{font-size:10px;color:#7a8790}.hint{background:#eef5f7;border-radius:8px;padding:7px;font-size:9px;margin-bottom:8px}@media(max-width:700px){header{height:54px;padding:7px 9px}h1{font-size:15px}.sub{display:none}.tabs{height:46px}.tab{font-size:9px}.view{top:100px}.panel{left:7px;right:7px;top:7px;width:auto;max-height:50vh}}</style></head><body><header><h1>🇬🇷 Kréta 2026</h1><div class="sub">teljes látnivaló-adatbázis · rugalmas napitervező · szállástól induló útvonal</div></header><nav class="tabs"><button class="tab active" id="mapTab" onclick="show('map')">🗺️ Teljes térkép</button><button class="tab" id="planTab" onclick="show('plan')">🧭 Mit csináljunk ma?</button><button class="tab" id="routeTab" onclick="show('route')">🚗 Útvonalterv</button></nav><main class="view"><iframe id="map" class="frame active" src="index.html" title="Kréta 2026 teljes térkép"></iframe><iframe id="plan" class="frame" src="tervezo.html" title="Kréta 2026 napitervező"></iframe><div id="route" class="frame"></div><section id="routebox" class="panel"><h2>🚗 Napi útvonalterv</h2><div class="hint">Minden nap <b>az adott napi szállásbázistól indul</b>. A programpontok ezután egymás után következnek. A szállás pontos címe esetén a navigációt a pontos címre lehet majd állítani.</div><div id="routelist"></div><button onclick="refreshRoute()" style="width:100%;padding:8px;border:1px solid #ccd5db;border-radius:8px;background:#fff;font-weight:800">🔄 Útvonal frissítése</button></section></main><script>const mapFrame=document.getElementById('map'),planFrame=document.getElementById('plan'),box=document.getElementById('routebox');const bases={Kolymvari:[35.528,24.222],"Chora Sfakion":[35.199,24.137],Selakano:[35.093,25.544],Sitia:[35.2087,26.1052],Rethymno:[35.369,24.473]};const dayBase={1:'Kolymvari',2:'Kolymvari',3:'Kolymvari',4:'Chora Sfakion',5:'Chora Sfakion',6:'Chora Sfakion',7:'Selakano',8:'Selakano',9:'Sitia',10:'Sitia',11:'Sitia',12:'Rethymno',13:'Rethymno',14:'Rethymno'};const dates={1:'szept. 25.',2:'szept. 26.',3:'szept. 27.',4:'szept. 28.',5:'szept. 29.',6:'szept. 30.',7:'okt. 1.',8:'okt. 2.',9:'okt. 3.',10:'okt. 4.',11:'okt. 5.',12:'okt. 6.',13:'okt. 7.',14:'okt. 8.'};function show(x){document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));if(x==='route'){mapFrame.classList.add('active');document.getElementById('routeTab').classList.add('active');box.classList.add('show');setTimeout(refreshRoute,150)}else{document.getElementById(x).classList.add('active');document.getElementById(x+'Tab').classList.add('active');box.classList.remove('show')}}function getPlan(){try{return JSON.parse(localStorage.getItem('kreta2026plan')||'{}')}catch(e){return {}}}function extract(){const saved=getPlan(),mp=mapFrame.contentWindow,pois=mp&&Array.isArray(mp.P)?mp.P:[],byName=new Map(pois.map(p=>[p[0],p])),out={};function walk(v,path){if(typeof v==='string'){const p=byName.get(v);if(p){const m=path.match(/(?:day|d)[ _-]?(\d{1,2})/i);const d=m?+m[1]:0;(out[d]??=[]).push(p)}return}if(Array.isArray(v)){v.forEach((x,i)=>walk(x,path+' '+i));return}if(v&&typeof v==='object')Object.keys(v).forEach(k=>walk(v[k],path+' '+k))}walk(saved,'');const raw=JSON.stringify(saved);if(Object.keys(out).length===0){pois.forEach(p=>{const i=raw.indexOf(JSON.stringify(p[0]).slice(1,-1));if(i>=0){const near=raw.slice(Math.max(0,i-100),i+100),m=near.match(/d(?:ay)?[^0-9]{0,4}(\d{1,2})/i);if(m)(out[+m[1]]??=[]).push(p)}})}Object.keys(out).forEach(k=>out[k]=[...new Map(out[k].map(p=>[p[0],p])).values()]);return out}function navUrl(from,to){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(to)+'&travelmode=driving'}function refreshRoute(){const data=extract();let html='';for(let d=1;d<=14;d++){const base=dayBase[d],pts=data[d]||[],b=bases[base];html+='<div class="daybox"><b>D'+d+' · '+dates[d]+'</b><div class="start">🏠 Indulás: '+base+'</div>';if(!pts.length){html+='<div class="empty">Még nincs hozzárendelt program.</div>'}else{let prev=base;pts.forEach((p,i)=>{const destination=p[0];html+='<div class="poi">'+(i+1)+'. 📍 <b>'+destination+'</b><br><a class="routebtn" target="_blank" rel="noopener" href="'+navUrl(prev,destination)+'">🧭 Navigáció: '+(prev===''+base?base:prev)+' → '+destination+'</a></div>';prev=destination})}if(d===14)html+='<div class="empty">✈️ Hazautazás: Chania repülőtér – a napi útvonal innen folytatódik a repülőtér felé.</div>';html+='</div>'}document.getElementById('routelist').innerHTML=html}mapFrame.addEventListener('load',()=>{if(box.classList.contains('show'))refreshRoute()});window.addEventListener('storage',e=>{if(e.key==='kreta2026plan'&&box.classList.contains('show'))refreshRoute()});setInterval(()=>{if(box.classList.contains('show'))refreshRoute()},2500);</script></body></html>
