<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384a"><title>Kréta 2026 · Egyfelületes térkép és tervező</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17212b;background:#eef2f4}header{height:58px;background:#12384a;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 2px 10px #0003;position:relative;z-index:10}h1{font-size:17px;margin:0;white-space:nowrap}.sub{font-size:10px;opacity:.8;margin-left:auto}.tabs{height:48px;background:#fff;border-bottom:1px solid #dce2e6;display:flex;gap:6px;padding:6px;position:relative;z-index:10}.tab{flex:1;max-width:260px;border:1px solid #d4dce1;border-radius:10px;background:#fff;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:#12384a;color:#fff;border-color:#12384a}.view{position:absolute;top:106px;bottom:0;left:0;right:0}.frame{width:100%;height:100%;border:0;display:none;background:#fff}.frame.active{display:block}@media(max-width:700px){header{height:54px;padding:7px 9px}h1{font-size:15px}.sub{display:none}.tabs{height:46px}.tab{font-size:11px}.view{top:100px}}</style></head><body><header><h1>🇬🇷 Kréta 2026</h1><div class="sub">teljes látnivaló-adatbázis · rugalmas napitervező</div></header><nav class="tabs"><button class="tab active" id="mapTab" onclick="show('map')">🗺️ Teljes térkép</button><button class="tab" id="planTab" onclick="show('plan')">🧭 Mit csináljunk ma?</button></nav><main class="view"><iframe id="map" class="frame active" src="index.html" title="Kréta 2026 teljes térkép"></iframe><iframe id="plan" class="frame" src="tervezo.html" title="Kréta 2026 napitervező"></iframe></main><script>function show(x){document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');document.getElementById(x+'Tab').classList.add('active')}</script></body></html>
