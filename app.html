<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384a"><title>Kréta 2026 · Egyfelületes térkép és tervező</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17212b;background:#eef2f4}header{height:58px;background:#12384a;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 2px 10px #0003;position:relative;z-index:20}h1{font-size:17px;margin:0;white-space:nowrap}.sub{font-size:10px;opacity:.8;margin-left:auto}.tabs{height:48px;background:#fff;border-bottom:1px solid #dce2e6;display:flex;gap:6px;padding:6px;position:relative;z-index:20}.tab{flex:1;border:1px solid #d4dce1;border-radius:10px;background:#fff;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:#12384a;color:#fff;border-color:#12384a}.view{position:absolute;top:106px;bottom:0;left:0;right:0}.frame{width:100%;height:100%;border:0;display:none;background:#fff}.frame.active{display:block}.planbox{position:absolute;z-index:15;right:12px;top:12px;width:310px;max-height:calc(100vh - 130px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px #0004;padding:11px;display:none}.planbox.show{display:block}.planbox h2{font-size:15px;margin:0 0 4px}.planbox p{font-size:10px;color:#65727a;margin:3px 0 8px}.daybox{border:1px solid #dce2e6;border-radius:9px;padding:7px;margin:5px 0}.daybox b{font-size:11px}.poi{font-size:10px;margin:3px 0}.empty{font-size:10px;color:#7a8790}@media(max-width:700px){header{height:54px;padding:7px 9px}h1{font-size:15px}.sub{display:none}.tabs{height:46px}.tab{font-size:10px}.view{top:100px}.planbox{left:7px;right:7px;top:7px;width:auto;max-height:48vh}}</style></head><body><header><h1>🇬🇷 Kréta 2026</h1><div class="sub">teljes látnivaló-adatbázis · rugalmas napitervező · közös saját terv</div></header><nav class="tabs"><button class="tab active" id="mapTab" onclick="show('map')">🗺️ Teljes térkép</button><button class="tab" id="planTab" onclick="show('plan')">🧭 Mit csináljunk ma?</button><button class="tab" id="savedTab" onclick="show('saved')">⭐ Saját terv a térképen</button></nav><main class="view"><iframe id="map" class="frame active" src="index.html" title="Kréta 2026 teljes térkép"></iframe><iframe id="plan" class="frame" src="tervezo.html" title="Kréta 2026 napitervező"></iframe><div id="saved" class="frame"></div><section id="planbox" class="planbox"><h2>⭐ Saját D1–D14 terv</h2><p>A tervezőben elmentett pontokat ugyanazon az oldalon látod, napokra bontva. A „Frissítés” gomb újraolvassa a telefonon tárolt tervet.</p><div id="planlist"></div><button onclick="refreshPlan()" style="width:100%;padding:7px;border:1px solid #ccd5db;border-radius:8px;background:#fff;font-weight:800">🔄 Terv frissítése</button></section></main><script>const mapFrame=document.getElementById('map'),planFrame=document.getElementById('plan'),box=document.getElementById('planbox');function show(x){document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));if(x==='saved'){mapFrame.classList.add('active');document.getElementById('savedTab').classList.add('active');box.classList.add('show');setTimeout(refreshPlan,100)}else{document.getElementById(x).classList.add('active');document.getElementById(x+'Tab').classList.add('active');box.classList.remove('show')}}function getPlan(){try{return JSON.parse(localStorage.getItem('kreta2026plan')||'{}')}catch(e){return {}}}function extract(){const saved=getPlan(),mp=mapFrame.contentWindow;const pois=mp&&Array.isArray(mp.P)?mp.P:[];const byName=new Map(pois.map(p=>[p[0],p]));const out={};function walk(v,path){if(typeof v==='string'){let p=byName.get(v);if(p){let m=path.match(/(?:day|d)[ _-]?(\d{1,2})/i);let d=m?+m[1]:0;(out[d]??=[]).push(p[0])}return}if(Array.isArray(v)){v.forEach((x,i)=>walk(x,path+' '+i));return}if(v&&typeof v==='object')Object.keys(v).forEach(k=>walk(v[k],path+' '+k))}walk(saved,'');const raw=JSON.stringify(saved);if(Object.keys(out).length===0){pois.forEach(p=>{let i=raw.indexOf(JSON.stringify(p[0]).slice(1,-1));if(i>=0){let near=raw.slice(Math.max(0,i-80),i+80),m=near.match(/d(?:ay)?[^0-9]{0,4}(\d{1,2})/i);if(m)(out[+m[1]]??=[]).push(p[0])}})}Object.keys(out).forEach(k=>out[k]=[...new Set(out[k])]);return out}function refreshPlan(){if(!mapFrame.contentWindow||!mapFrame.contentWindow.P)return;const data=extract();let html='';for(let d=1;d<=14;d++){let a=data[d]||[];html+='<div class="daybox"><b>D'+d+'</b> <span class="empty">'+(a.length?'· '+a.length+' pont':'· üres')+'</span>'+(a.length?a.map(n=>'<div class="poi">📍 '+n+'</div>').join(''):'')+'</div>'}document.getElementById('planlist').innerHTML=html;highlight(data)}function highlight(data){const w=mapFrame.contentWindow;if(!w||!w.map||!Array.isArray(w.P))return;if(w.__myPlanLayers){w.__myPlanLayers.forEach(x=>w.map.removeLayer(x));}w.__myPlanLayers=[];const names=new Set(Object.values(data).flat());const pts=w.P.filter(p=>names.has(p[0]));pts.forEach(p=>{const m=w.L.marker([p[1],p[2]],{zIndexOffset:1000}).addTo(w.map).bindPopup('<b>⭐ Saját terv</b><br>'+p[0]);w.__myPlanLayers.push(m)});if(pts.length)w.map.fitBounds(w.L.latLngBounds(pts.map(p=>[p[1],p[2]])).pad(.12),{maxZoom:10})}mapFrame.addEventListener('load',()=>{if(box.classList.contains('show'))refreshPlan()});window.addEventListener('storage',e=>{if(e.key==='kreta2026plan'&&box.classList.contains('show'))refreshPlan()});setInterval(()=>{if(box.classList.contains('show'))refreshPlan()},2500);</script></body></html>
