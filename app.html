vező</button><button type="button" class="tab" id="routeTab">🚗 Útvonal</button><button type="button" class="tab" id="smartTab">✨ Ajánló</button></nav><main class="view"><iframe id="map" class="frame active" src="index.html?v=20260922" title="Teljes térkép"></iframe><iframe id="plan" class="frame" src="tervezo.html" title="Napi tervező"></iframe><iframe id="smart" class="frame" src="ajanlo.html" title="Intelligens napi programajánló"></iframe><section id="routebox" class="panel" aria-label="Napi útvonal"><div class="topline"><h2>🚗 Napi útvonal</h2><span id="count" class="badge"></span></div><div class="hint">A nap mindig az aznapi szállásbázistól indul. Alapból a saját sorrendedet használjuk. Az új pontok hozzáadásakor kérheted a földrajzi közelség szerinti rendezést. D14 végpontja Chania repülőtér.</div><div class="modebar"><button id="nearBtn">📍 Közeli sorrend</button><button id="manualBtn" class="active">✋ Saját sorrend</button></div><div id="routelist"></div><div class="actions"><button type="button" class="primary" id="refreshBtn">🔄 Frissítés</button><button type="button" id="shareBtn">📤 Megosztás</button><button type="button" id="exportBtn">⬇️ Export</button></div></section></main><script>(function(){'use strict';const mapFrame=document.getElementById('map'),planFrame=document.getElementById('plan'),smartFrame=document.getElementById('smart'),box=document.getElementById('routebox');const tabs={map:document.getElementById('mapTab'),plan:document.getElementById('planTab'),route:document.getElementById('routeTab'),smart:document.getElementById('smartTab')};const bases={'A&G Apartments':[35.538668,23.778278],'Avra Sfakia Apartments':[35.200516,24.141693],'Apartments Gonies – Athina':[35.232600,25.439928],'Stefania Suite – Itida Suites':[35.200502,26.104514],'White Swan':[35.365166,24.488117]};const dayBase={1:'A&G Apartments',2:'A&G Apartments',3:'A&G Apartments',4:'Avra Sfakia Apartments',5:'Avra Sfakia Apartments',6:'Avra Sfakia Apartments',7:'Apartments Gonies – Athina',8:'Apartments Gonies – Athina',9:'Stefania Suite – Itida Suites',10:'Stefania Suite – Itida Suites',11:'Stefania Suite – Itida Suites',12:'White Swan',13:'White Swan',14:'White Swan'};const dates={1:'szept. 25.',2:'szept. 26.',3:'szept. 27.',4:'szept. 28.',5:'szept. 29.',6:'szept. 30.',7:'okt. 1.',8:'okt. 2.',9:'okt. 3.',10:'okt. 4.',11:'okt. 5.',12:'okt. 6.',13:'okt. 7.',14:'okt. 8.'};let routeMode='manual';function show(x){document.querySelectorAll('.frame').forEach(e=>e.classList.remove('active'));Object.values(tabs).forEach(e=>e.classList.remove('active'));box.classList.remove('show');if(x==='route'){mapFrame.classList.add('active');tabs.route.classList.add('active');box.classList.add('show');refreshRoute()}else{document.getElementById(x).classList.add('active');tabs[x].classList.add('active');setTimeout(()=>{try{document.getElementById(x).contentWindow.dispatchEvent(new Event('resize'))}catch(e){}},80)}}Object.keys(tabs).forEach(k=>tabs[k].addEventListener('click',()=>show(k)));function getPlan(){try{return JSON.parse(localStorage.getItem('kreta2026plan')||'{}')}catch(e){return {}}}function getOrder(){try{return JSON.parse(localStorage.getItem('kreta2026order')||'{}')}catch(e){return {}}}function saveOrder(o){localStorage.setItem('kreta2026order',JSON.stringify(o))}function pois(){try{const p=mapFrame.contentWindow.P;return Array.isArray(p)?p:[]}catch(e){return []}}function extract(){const saved=getPlan(),all=pois(),by=new Map(all.map(p=>[p[0],p])),out={};Object.keys(saved).forEach(name=>{const d=String(saved[name]).replace(/\D/g,'');const p=by.get(name);if(d&&p){if(!out[d])out[d]=[];if(!out[d].some(x=>x[0]===p[0]))out[d].push(p)}});const order=getOrder();Object.keys(out).forEach(d=>{if(Array.isArray(order[d])){const rank=new Map(order[d].map((n,i)=>[n,i]));out[d].sort((a,b)=>(rank.has(a[0])?rank.get(a[0]):99999)-(rank.has(b[0])?rank.get(b[0]):99999))}});return out}function dist(a,b){const R=6371,r=Math.PI/180,la=a[0]*r,lb=b[0]*r,dlat=(b[0]-a[0])*r,dlon=(b[1]-a[1])*r,h=Math.sin(dlat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function optimize(base,pts){let cur=bases[base],left=pts.slice(),out=[];while(left.length){let bi=0,bd=Infinity;left.forEach((p,i)=>{const d=dist(cur,[p[1],p[2]]);if(d<bd){bd=d;bi=i}});const p=left.splice(bi,1)[0];out.push(p);cur=[p[1],p[2]]}return out}function nav(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode=driving'}function full(base,pts,end){const x=[base,...pts.map(p=>p[0]),end],o=x.shift(),d=x.pop()||o;let u=nav(o,d);if(x.length)u+='&waypoints='+encodeURIComponent(x.join('|'));return u}function setMode(m){routeMode=m;document.getElementById('nearBtn').classList.toggle('active',m==='near');document.getElementById('manualBtn').classList.toggle('active',m==='manual');refreshRoute()}function moveDay(d,idx,delta){const data=extract(),pts=data[d]||[];const ni=idx+delta;if(idx<0||idx>=pts.length||ni<0||ni>=pts.length)return;const order=getOrder(),arr=pts.map(p=>p[0]);[arr[idx],arr[ni]]=[arr[ni],arr[idx]];order[d]=arr;saveOrder(order);refreshRoute()}function refreshRoute(){const data=extract();let total=0,h='';for(let d=1;d<=14;d++){const base=dayBase[d];let pts=(data[d]||[]).slice();if(routeMode==='near')pts=optimize(base,pts);total+=pts.length;h+='<article class="daybox"><button type="button" class="dayhead"><span>D'+d+' · '+dates[d]+'</span><span>'+pts.length+' pont ▾</span></button><div class="daybody"'+(pts.length?'':' hidden')+'><div class="start">🏠 Indulás: '+base+'</div>';if(!pts.length)h+='<div class="empty">Még nincs hozzárendelt program.</div>';else{let prev=base;pts.forEach((p,i)=>{const controls=routeMode==='manual'?'<button class="move" data-day="'+d+'" data-idx="'+i+'" data-delta="-1">↑</button><button class="move" data-day="'+d+'" data-idx="'+i+'" data-delta="1">↓</button>':'';h+='<div class="poi"><div class="poirow"><span class="num">'+(i+1)+'</span><span style="flex:1">📍 <b>'+p[0]+'</b></span>'+controls+'</div><a class="routebtn" target="_blank" rel="noopener" href="'+nav(prev,p[0])+'">🧭 '+prev+' → '+p[0]+'</a></div>';prev=p[0]});const end=d===14?'Chania International Airport':base;h+='<div class="end">'+(d===14?'✈️ Végpont: Chania repülőtér':'🏠 Vissza: '+base)+'</div><a class="routebtn" target="_blank" rel="noopener" href="'+nav(prev,end)+'">'+(d===14?'✈️':'↩️')+' '+prev+' → '+end+'</a><br><a class="dayfull" target="_blank" rel="noopener" href="'+full(base,pts,end)+'">🗺️ Teljes napi útvonal</a></div>'}h+='</article>'}document.getElementById('routelist').innerHTML=h;document.getElementById('count').textContent=total+' kiválasztott pont';document.querySelectorAll('.dayhead').forEach(b=>b.addEventListener('click',()=>b.nextElementSibling.hidden=!b.nextElementSibling.hidden));document.querySelectorAll('.move').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();moveDay(+b.dataset.day,+b.dataset.idx,+b.dataset.delta)}))}function exportPlan(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({plan:getPlan(),order:getOrder()},null,2)],{type:'application/json'}));a.download='kreta-2026-terv.json';document.body.appendChild(a);a.click();a.remove()}async function sharePlan(){if(navigator.share){try{await navigator.share({title:'Kréta 2026',text:'Kréta 2026 útiterv',url:location.href})}catch(e){}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(location.href);alert('A link a vágólapra került.')}catch(e){alert(location.href)}}}document.getElementById('refreshBtn').addEventListener('click',refreshRoute);document.getElementById('shareBtn').addEventListener('click',sharePlan);document.getElementById('exportBtn').addEventListener('click',exportPlan);document.getElementById('nearBtn').addEventListener('click',()=>setMode('near'));document.getElementById('manualBtn').addEventListener('click',()=>setMode('manual'));if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));mapFrame.addEventListener('load',()=>{if(box.classList.contains('show'))refreshRoute()});window.addEventListener('storage',e=>{if((e.key==='kreta2026plan'||e.key==='kreta2026order')&&box.classList.contains('show'))refreshRoute()})})();</script></body></html>
