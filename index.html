t és hegyvidék.','Dikteon opcionális.'],9:['10.03','Richtis + Mochlos → Sitia','Túra és tengerpart.','Gournia opcionális.'],10:['10.04','Toplou + Vai + Itanos','Kelet-krétai nap.','Palaikastro opcionális.'],11:['10.05','Kato Zakros + Zakros','Régészet + természet.','Xerokampos csak ha nem lesz túl sok autózás.'],12:['10.06','Spinalonga + Agios Nikolaos → Rethymno','Átköltözős nap.','Rethymno óváros este.'],13:['10.07','Arkadi + Eleftherna + Margarites','Laza kulturális és falusi nap.','Argyroupoli/Mili opcionális.'],14:['10.08','Rethymno → Chania repülőtér','Hazautazás.','A járat indulásához igazítsátok.']};const map=L.map('map').setView([35.20,25.15],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let day=0,cat='';let marks=[],lines=[];const $=id=>document.getElementById(id);function markerIcon(x){return L.divIcon({className:'pin',html:C[x[3]][0],iconSize:[30,30],iconAnchor:[15,15]})}function stayIcon(){return L.divIcon({className:'pin',html:'🏠',iconSize:[32,32],iconAnchor:[16,16]})}function clear(){marks.forEach(m=>map.removeLayer(m));lines.forEach(l=>map.removeLayer(l));marks=[];lines=[]}function draw(){clear();let arr=P.filter(x=>(!day||x[4]===day)&&(!cat||x[3]===cat));arr.forEach(x=>{let m=L.marker([x[1],x[2]],{icon:markerIcon(x)}).addTo(map).bindPopup('<b>'+x[5]+' '+x[0]+'</b><br>'+C[x[3]][0]+' '+C[x[3]][1]+' · D'+x[4]+'<br>'+x[6]);marks.push(m)});let ss=S.filter(x=>!day||x[3].includes('D'+day));ss.forEach(x=>{let m=L.marker([x[1],x[2]],{icon:stayIcon()}).addTo(map).bindPopup('<b>🏠 '+x[0]+'</b><br>'+x[3]);marks.push(m)});if(day){let r=arr.slice(0,12);for(let i=1;i<r.length;i++)lines.push(L.polyline([[r[i-1][1],r[i-1][2]],[r[i][1],r[i][2]]],{className:'route'}).addTo(map))}else if(arr.length){map.fitBounds(L.latLngBounds(arr.map(x=>[x[1],x[2]])).pad(.08),{maxZoom:9})}$("content").dataset.count=arr.length}function renderDays(){let h='<button class="'+(!day?'active':'')+'" onclick="setDay(0)">Mind</button>';for(let i=1;i<=14;i++)h+='<button class="'+(day===i?'active':'')+'" onclick="setDay('+i+')">D'+i+'</button>';$('days').innerHTML=h}function renderCats(){let h='<button class="'+(!cat?'active':'')+'" onclick="setCat(\'\')">Mind</button>';for(let k in C)h+='<button class="'+(cat===k?'active':'')+'" onclick="setCat(\''+k+'\')">'+C[k][0]+'</button>';$('cats').innerHTML=h}function render(){renderDays();renderCats();let el=$('content');if(!day){el.innerHTML='<div class="dayhead"><div><h2>14 napos áttekintés</h2><div class="date">5 szállásbázis · 14 nap</div></div></div><p class="intro">A térkép mostantól a napi programot, a szállásokat és a fő/alternatív látnivalókat külön kezeli.</p>'+Object.keys(plans).map(i=>'<div class="card" onclick="setDay('+i+')"><strong>D'+i+' · '+plans[i][0]+' · '+plans[i][1]+'</strong><small>'+plans[i][2]+'</small></div>').join('');return}let p=plans[day];let arr=P.filter(x=>x[4]===day);el.innerHTML='<div class="dayhead"><div><h2>D'+day+' · '+p[1]+'</h2><div class="date">'+p[0]+'</div></div></div><p class="intro">'+p[2]+'</p>'+arr.map(x=>'<div class="card"><span class="badge '+(x[5]=='⭐'?'must':x[5]=='💎'?'gem':'opt')+'">'+x[5]+'</span><strong>'+x[0]+'</strong><small>'+C[x[3]][0]+' '+C[x[3]][1]+' · '+x[6]+'</small></div>').join('')+'<div class="stay"><b>🏠 Szállás</b><br>'+S.find(x=>x[3].includes('D'+day))[0]+'</div>'}function setDay(x){day=x;cat='';render();draw();if(x){let a=P.filter(p=>p[4]===x);if(a.length)map.fitBounds(L.latLngBounds(a.map(p=>[p[1],p[2]])).pad(.15),{maxZoom:11})}}function setCat(x){cat=x;renderDays();renderCats();draw()}function allDays(){day=0;cat='';render();draw();fitCrete()}function showStays(){day=0;cat='';render();draw();map.fitBounds(L.latLngBounds(S.map(x=>[x[1],x[2]])).pad(.2))}function fitCrete(){map.setView([35.20,25.15],9)}render();draw();</script></body></html>
