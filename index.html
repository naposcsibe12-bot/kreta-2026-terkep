<style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17212b}#map{position:fixed;inset:0}
.panel{position:fixed;z-index:1000;left:12px;top:12px;width:400px;max-width:calc(100vw - 24px);background:#fff;border-radius:16px;box-shadow:0 6px 28px #0004;overflow:hidden}
.head{padding:12px 14px;background:#12384a;color:#fff}.head h1{font-size:19px;margin:0}.head p{font-size:10px;margin:3px 0 0;opacity:.85}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 10px 6px}.days button{height:34px;border:1px solid #d5dce1;border-radius:7px;background:#fff;font-weight:800;font-size:11px;cursor:pointer;touch-action:manipulation}.days button.active{background:#12384a;color:#fff}
.catbar{display:flex;gap:5px;overflow-x:auto;padding:5px 10px 8px;scrollbar-width:none;border-bottom:1px solid #e5e8eb}.catbar::-webkit-scrollbar{display:none}.catbar button{flex:0 0 auto;border:1px solid #d5dce1;background:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:700;cursor:pointer}.catbar button.active{background:#12384a;color:#fff}
.info{padding:9px 11px;max-height:180px;overflow:auto}.info h2{margin:0;font-size:15px}.sub{font-size:10px;color:#65727c;margin:2px 0 7px}.route-list{display:flex;flex-direction:column;gap:4px}.stop{display:flex;align-items:center;gap:7px;padding:5px 6px;border:1px solid #e1e6e9;border-radius:8px;font-size:11px;background:#fff}.num{width:23px;height:23px;flex:0 0 23px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#12384a;color:#fff;font-weight:900}.stop small{display:block;color:#697681;font-size:9px}.opt{opacity:.72}.actions{display:flex;gap:5px;padding:7px 10px;border-top:1px solid #e5e8eb}.actions button{flex:1;border:1px solid #d5dce1;background:#fff;border-radius:8px;padding:7px 3px;font-size:10px;font-weight:800;cursor:pointer}.legend{padding:0 10px 8px;font-size:9px;color:#71808a}.pin{font-size:22px;text-align:center}.route{stroke-width:4;opacity:.55;stroke-dasharray:8 7}
@media(max-width:700px){.panel{left:7px;right:7px;top:7px;width:auto;max-width:none;border-radius:14px}.head{padding:9px 11px}.head h1{font-size:17px}.days{grid-template-columns:repeat(7,1fr);padding:7px 8px 5px;gap:4px}.days button{height:31px;font-size:10px}.catbar{padding:4px 8px 7px}.info{max-height:125px;padding:7px 9px}.info h2{font-size:14px}.stop{font-size:10px;padding:4px}.num{width:21px;height:21px;flex-basis:21px;font-size:10px}.actions{padding:6px 8px}.actions button{padding:6px 2px}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px}}
@media(max-height:700px){.info{max-height:92px}.head{padding:7px 10px}.days{padding-top:5px;padding-bottom:4px}}
</style></head>

['Arkadi Monastery',35.241,24.629,'m',13,'⭐','Történelmi kolostor'],['Eleftherna',35.343,24.630,'a',13,'🟡','Régészet + múzeum'],['Margarites',35.344,24.688,'v',13,'💎','Fazekasfalu'],['Argyroupoli Springs',35.284,24.337,'t',13,'💎','Opcionális'],['Mili Gorge',35.340,24.509,'t',13,'💎','Opcionális túra'],
['Chania repülőtér',35.531,24.149,'v',14,'🧭','Hazautazás']];

const plans={1:['09.25','Érkezés · Kolymvari',['Kolymvari']],2:['09.26','Balos + Gramvousa',['Balos Lagoon','Gramvousa']],3:['09.27','Falasarna + Polyrinia',['Falasarna','Polyrinia','Milia Mountain Retreat','Manousakis Winery']],4:['09.28','Elafonissi → Kedrodasos → Sfakia',['Elafonissi','Kedrodasos']],5:['09.29','Loutro + Glyka Nera',['Loutro','Glyka Nera','Loutro Coastal Walk']],6:['09.30','Samaria VAGY Imbros',['Samaria Gorge','Imbros Gorge','Aradena Gorge']],7:['10.01','Sfakia → Kourtaliotiko → Preveli → Selakano',['Kourtaliotiko Gorge','Preveli Beach','Triopetra Beach']],8:['10.02','Kritsa + Panagia Kera + Lato + Lassithi',['Kritsa','Panagia Kera','Lato','Lassithi Plateau','Dikteon Cave']],9:['10.03','Richtis + Mochlos → Sitia',['Richtis Gorge','Mochlos','Gournia']],10:['10.04','Toplou + Vai + Itanos',['Toplou Monastery','Vai Palm Beach','Itanos','Palaikastro']],11:['10.05','Kato Zakros + Zakros',['Kato Zakros','Zakros Palace','Zakros Gorge','Xerokampos']],12:['10.06','Spinalonga + Agios Nikolaos → Rethymno',['Spinalonga','Elounda','Agios Nikolaos','Rethymno óváros']],13:['10.07','Arkadi + Eleftherna + Margarites',['Arkadi Monastery','Eleftherna','Margarites','Argyroupoli Springs','Mili Gorge']],14:['10.08','Rethymno → Chania repülőtér',['Chania repülőtér']]};
const map=L.map('map').setView([35.20,25.15],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let day=0,cat='',mode='normal',marks=[],lines=[];
const el=id=>document.getElementById(id);function clear(){marks.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));marks=[];lines=[]}
function icon(emoji,cls='pin'){return L.divIcon({className:cls,html:emoji,iconSize:[30,30],iconAnchor:[15,15]})}
function setDay(d){day=d;mode='normal';render();draw();if(d)setTimeout(()=>el('info').scrollTop=0,0)}
function setCat(c){cat=c;mode='normal';render();draw()}
function allDays(){day=0;cat='';mode='normal';render();draw();fitCrete()}
function staysOnly(){mode='stays';render();draw();fitCrete()}
function fitCrete(){map.fitBounds([[35.00,23.35],[35.70,26.35]],{padding:[20,20],maxZoom:9})}
function render(){let h='<button class="'+(!day&&mode==='normal'?'active':'')+'" onclick="setDay(0)">Mind</button>';for(let i=1;i<=14;i++)h+='<button class="'+(day===i&&mode==='normal'?'active':'')+'" onclick="setDay('+i+')">D'+i+'</button>';el('days').innerHTML=h;let c='<button class="'+(!cat?'active':'')+'" onclick="setCat(\'\')">Összes</button>';Object.keys(C).forEach(k=>c+='<button class="'+(cat===k?'active':'')+'" onclick="setCat(\''+k+'\')">'+C[k][0]+' '+C[k][1]+'</button>');el('cats').innerHTML=c;if(mode==='stays'){el('info').innerHTML='<h2>🏠 Szállások</h2><div class="sub">Az öt bázis a teljes út során</div>'+S.map(x=>'<div class="stop"><span class="num">🏠</span><div><b>'+x[0]+'</b><small>'+x[3]+'</small></div></div>').join('');return}if(!day){el('info').innerHTML='<h2>14 napos áttekintés</h2><div class="sub">Válassz D1–D14-et. A kiválasztott nap pontjai sorszámozva jelennek meg a térképen.</div>';return}let p=plans[day],names=p[2],html='<h2>D'+day+' · '+p[0]+' · '+p[1]+'</h2><div class="sub">A sorrend a napi program javasolt sorrendje. Az opcionális pontok halványabban jelennek meg.</div><div class="route-list">';names.forEach((n,i)=>{let x=P.find(q=>q[0]===n);if(!x)return;let opt=x[5]==='🟡'||x[5]==='💎';html+='<div class="stop '+(opt?'opt':'')+'"><span class="num">'+(i+1)+'</span><div><b>'+x[5]+' '+x[0]+'</b><small>'+C[x[3]][0]+' '+C[x[3]][1]+' · '+x[6]+'</small></div></div>'});el('info').innerHTML=html+'</div>'}
function draw(){clear();if(mode==='stays'){S.forEach(x=>marks.push(L.marker([x[1],x[2]],{icon:icon('🏠','pin')}).addTo(map).bindPopup('<b>🏠 '+x[0]+'</b><br>'+x[3])));return}let arr=P.filter(x=>(!day||x[4]===day)&&(!cat||x[3]===cat));if(day){let names=plans[day][2],ordered=names.map(n=>P.find(x=>x[0]===n)).filter(Boolean);ordered.forEach((x,i)=>{let m=L.marker([x[1],x[2]],{icon:icon(String(i+1),'pin')}).addTo(map).bindPopup('<b>'+x[5]+' '+x[0]+'</b><br>'+C[x[3]][0]+' · D'+x[4]+'<br>'+x[6]);marks.push(m)});for(let i=1;i<ordered.length;i++)lines.push(L.polyline([[ordered[i-1][1],ordered[i-1][2]],[ordered[i][1],ordered[i][2]]],{className:'route'}).addTo(map))}else{arr.forEach(x=>marks.push(L.marker([x[1],x[2]],{icon:icon(C[x[3]][0])}).addTo(map).bindPopup('<b>'+x[5]+' '+x[0]+'</b><br>'+C[x[3]][1]+' · D'+x[4]+'<br>'+x[6])))}S.filter(x=>!day||x[3].includes('D'+day)).forEach(x=>marks.push(L.marker([x[1],x[2]],{icon:icon('🏠','pin')}).addTo(map).bindPopup('<b>🏠 '+x[0]+'</b><br>'+x[3])));if(day&&arr.length)map.fitBounds(L.latLngBounds(marks.map(m=>m.getLatLng())).pad(.35),{maxZoom:12})}
render();draw();
