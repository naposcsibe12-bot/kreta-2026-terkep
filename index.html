<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kréta 2026 · útiterv</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18212b}#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:12px;top:12px;width:410px;max-width:calc(100vw - 24px);background:#fff;border-radius:16px;box-shadow:0 5px 25px #0004;overflow:hidden}.head{padding:12px 14px;background:#12384a;color:white}.head h1{font-size:19px;margin:0}.head p{font-size:11px;margin:3px 0 0;opacity:.85}.bar{padding:9px 11px;border-bottom:1px solid #e5e8eb}.label{font-size:10px;font-weight:800;color:#71808b;text-transform:uppercase;margin-bottom:6px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.days button{height:34px;border:1px solid #d8dee3;border-radius:7px;background:#fff;font-weight:800;font-size:11px;cursor:pointer;touch-action:manipulation}.days button.active{background:#12384a;color:#fff;border-color:#12384a}.cats{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cats button{flex:0 0 auto;border:1px solid #d8dee3;background:#fff;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:700;cursor:pointer;touch-action:manipulation}.cats button.active{background:#12384a;color:#fff}.info{max-height:240px;overflow:auto;padding:10px 12px;background:#fff}.info h2{font-size:16px;margin:0}.date{font-size:10px;color:#77848e}.desc{font-size:11px;color:#56636d;margin:3px 0 8px}.item{padding:7px 8px;margin:5px 0;border:1px solid #e1e5e8;border-radius:9px;font-size:11px}.item small{display:block;color:#697681;margin-top:2px}.tag{font-size:10px;font-weight:800;margin-right:4px}.actions{display:flex;gap:5px;padding:8px 11px;border-top:1px solid #e5 Argyroupoli vagy Mili opcionális.'],14:['10.08','Rethymno → Chania repülőtér','Hazautazás.','A járathoz igazítva.']};const map=L.map('map').setView([35.20,25.15],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let day=0,cat='',mode='normal',marks=[],lines=[];const el=id=>document.getElementById(id);function icon(x){return L.divIcon({className:'pin',html:C[x[3]][0],iconSize:[30,30],iconAnchor:[15,15]})}function clear(){marks.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));marks=[];lines=[]}function draw(){clear();if(mode==='stays'){S.forEach(x=>marks.push(L.marker([x[1],x[2]],{icon:L.divIcon({className:'staypin',html:'🏠',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(map).bindPopup('<b>🏠 '+x[0]+'</b><br>'+x[3])));return}let arr=P.filter(x=>(!day||x[4]===day)&&(!cat||x[3]===cat));arr.forEach(x=>marks.push(L.marker([x[1],x[2]],{icon:icon(x)}).addTo(map).bindPopup('<b>'+x[5]+' '+x[0]+'</b><br>'+C[x[3]][0]+' '+C[x[3]][1]+' · D'+x[4]+'<br>'+x[6])));S.filter(x=>!day||x[3].includes('D'+day)).forEach(x=>marks.push(L.marker([x[1],x[2]],{icon:L.divIcon({className:'staypin',html:'🏠',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(map).bindPopup('<b>🏠 '+x[0]+'</b><br>'+x[3])));if(day&&arr.length>1)for(let i=1;i<arr.length;i++)lines.push(L.polyline([[arr[i-1][1],arr[i-1][2]],[arr[i][1],arr[i][2]]],{className:'route'}).addTo(map))}function render(){let h='<button class="'+(!day&&!mode==='stays'?'active':'')+'" onclick="setDay(0)">Mind</button>';for(let i=1;i<=14;i++)h+='<button class="'+(day===i&&mode==='normal'?'active':'')+'" onclick="setDay('+i+')">D'+i+'</button>';el('days').innerHTML=h;let c='<button class="'+(!cat?'active':'')+'" onclick="setCat(\'\')">Összes</button>';Object.keys(C).forEach(k=>c+='<button class="'+(cat===k?'active':'')+'" onclick="setCat(\''+k+'\')">'+C[k][0]+' '+C[k][1]+'</button>');el('cats').innerHTML=c;if(mode==='stays'){el('info').innerHTML='<h2>🏠 Szállások</h2><div class="desc">Az öt bázis külön látható a térképen.</div>'+S.map(x=>'<div class="item"><b>'+x[0]+'</b><small>'+x[3]+'</small></div>').join('');return}if(!day){el('info').innerHTML='<h2>14 napos áttekintés</h2><div class="desc">Válassz D1–D14-et. A napi pontok és a hozzá tartozó szállás jelenik meg.</div><div class="item">📱 Mobilon a térkép nagy része szabadon látható; a leírás rövid és görgethető.</div>'}else{let p=plans[day],pts=P.filter(x=>x[4]===day&&(!cat||x[3]===cat));el('info').innerHTML='<h2>D'+day+' · '+p[1]+'</h2><div class="date">'+p[0]+' · '+p[2]+'</div><div class="item">'+p[3]+'</div>'+pts.map(x=>'<div class="item"><span class="tag">'+x[5]+'</span><b>'+x[0]+'</b><small>'+C[x[3]][0]+' '+C[x[3]][1]+'</small></div>').join('')}}function setDay(x){mode='normal';day=x;cat='';render();draw()}function setCat(x){mode='normal';cat=x;render();draw()}function allDays(){mode='normal';day=0;cat='';render();draw();fitCrete()}function staysOnly(){mode='stays';day=0;cat='';render();draw();map.fitBounds(L.latLngBounds(S.map(x=>[x[1],x[2]])).pad(.3),{maxZoom:9})}function fitCrete(){map.fitBounds([[35.00,23.45],[35.65,26.40]],{padding:[20,20]})}render();draw();</script></body></html>
