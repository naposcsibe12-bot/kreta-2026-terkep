2],iconAnchor:[10,30]})}).addTo(map).bindPopup('<b>🏠 '+x[0]+'</b><br>'+x[3])));if(day&&arr.length>1){for(let i=1;i<arr.length;i++)lines.push(L.polyline([[arr[i-1][1],arr[i-1][2]],[arr[i][1],arr[i][2]]],{className:'route'}).addTo(map));map.fitBounds(L.latLngBounds(arr.map(x=>[x[1],x[2]])).pad(.18),{maxZoom:12})}else if(!day&&arr.length)map.fitBounds(L.latLngBounds(arr.map(x=>[x[1],x[2]])).pad(.06),{maxZoom:9})}function render(){let h='<button class="'+(mode==='all'&&!day?'active':'')+'" onclick="allPlaces()">Mind</button>';for(let i=1;i<=14;i++)h+='<button class="'+(day===i&&mode==='all'?'active':'')+'" onclick="setDay('+i+')">D'+i+'</button>';el('days').innerHTML=h;let c='<button class="'+(!cat?'active':'')+'" onclick="setCat(\'\')">Összes</button>';Object.keys(C).forEach(k=>c+='<button class="'+(cat===k?'active':'')+'" onclick="setCat(\''+k+'\')">'+C[k][0]+' '+C[k][1]+'</button>');el('cats').innerHTML=c;const sb=el('scenicBtn');if(sb){sb.textContent=(scenicVisible?'🛣️ Panoráma utak ✓':'🛣️ Panoráma utak');sb.classList.toggle('primary',scenicVisible)}if(mode==='stays'){el('info').innerHTML='<h2>🏠 Szállások</h2><div class="desc">Az öt bázis és a hozzájuk tartozó napok.</div>';return}let arr=cat==='r'?[]:P.filter(x=>(mode==='flex'?x[4]===0:(!day||x[4]===day))&&(!cat||x[3]===cat));let title=cat==='r'?'🛣️ Panorámautak':(day?'D'+day+' · '+plans[day][1]:(mode==='flex'?'💎 Rugalmasan beilleszthető pontok':'🗺️ Egész Kréta'));const scenicInfo=cat==='r'?('<div class="desc">'+RP.length+' panorámaút-ajánlás · csak jelölőpontok a térképen, vonal nélkül.</div>'+RP.map((x,i)=>'<div class="item"><b>🛣️ '+(i+1)+'. '+x.name+'</b><small>'+x.note+'</small></div>').join('')):'';el('info').innerHTML='<h2>'+title+'</h2>'+(cat==='r'?scenicInfo:'<div class="desc">'+arr.length+' látnivaló · az útitervben nem szereplő pontok is megmaradnak a teljes nézetben.</div>'+arr.slice(0,10).map((x,i)=>'<div class="item">'+(day?'<b>①'.replace('①',String(i+1))+' </b>':'')+x[5]+' <b>'+x[0]+'</b><small>'+C[x[3]][0]+' '+C[x[3]][1]+'</small></div>').join('')+(arr.length>10?'<div class="desc">+ további '+(arr.length-10)+' pont a térképen</div>':'')}function setDay(d){day=d;mode='all';render();draw()}function setCat(c){cat=c;render();draw()}function allPlaces(){day=0;mode='all';render();draw()}function flexPlaces(){day=0;mode='flex';render();draw()}function toggleScenic(){scenicVisible=!scenicVisible;render();draw()}function staysOnly(){day=0;mode='stays';render();draw()}render();draw();</script></body></html>
