name: Build offline OSM package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-offline-osm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PMTiles CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/download/v1.22.3/go-pmtiles_1.22.3_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin pmtiles
          pmtiles version

      - name: Find latest Protomaps OSM build
        id: source
        shell: bash
        run: |
          set -euo pipefail
          for offset in 0 1 2 3 4 5 6 7; do
            DAY="$(date -u -d "-${offset} day" +%Y%m%d)"
            URL="https://build.protomaps.com/${DAY}.pmtiles"
            if curl -fsSI --max-time 30 "${URL}" >/dev/null 2>&1; then
              echo "url=${URL}" >> "$GITHUB_OUTPUT"
              echo "Using ${URL}"
              exit 0
            fi
          done
          echo "No recent Protomaps daily build is reachable." >&2
          exit 1

      - name: Extract Crete OSM basemap
        run: |
          set -euo pipefail
          mkdir -p offline-assets
          pmtiles extract "${{ steps.source.outputs.url }}" offline-assets/crete.pmtiles             --bbox="23.15,34.72,26.78,35.72"             --maxzoom=13             --overfetch=0
          test -s offline-assets/crete.pmtiles
          ls -lh offline-assets/crete.pmtiles

      - name: Verify PMTiles archive and save metadata
        run: |
          set -euo pipefail
          pmtiles verify offline-assets/crete.pmtiles
          pmtiles show offline-assets/crete.pmtiles --metadata > offline-assets/osm-tile-metadata.json
          python - <<'PY'
          import json
          p='offline-assets/osm-tile-metadata.json'
          data=json.load(open(p,encoding='utf-8'))
          layers=[x.get('id') for x in data.get('vector_layers',[])]
          print('PMTiles layers:', ', '.join(layers))
          assert layers, 'No vector_layers found in PMTiles metadata'
          assert 'roads' in layers and 'water' in layers, 'Expected Protomaps roads/water layers are missing'
          PY

      - name: Bundle offline map libraries
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          npm --prefix "$TMP" init -y >/dev/null 2>&1
          npm --prefix "$TMP" install --no-audit --no-fund maplibre-gl@5.6.0 pmtiles@4.5.0
          cp "$TMP/node_modules/maplibre-gl/dist/maplibre-gl.js" offline-assets/maplibre-gl.js
          cp "$TMP/node_modules/maplibre-gl/dist/maplibre-gl.css" offline-assets/maplibre-gl.css
          cp "$TMP/node_modules/pmtiles/dist/pmtiles.js" offline-assets/pmtiles.js
          ls -lh offline-assets/maplibre-gl.js offline-assets/maplibre-gl.css offline-assets/pmtiles.js

      - name: Write OSM package metadata
        shell: bash
        run: |
          cat > offline-assets/osm-package.json <<EOF
          {
            "source": "${{ steps.source.outputs.url }}",
            "region": "Crete",
            "bbox": [23.15, 34.72, 26.78, 35.72],
            "maxzoom": 13,
            "format": "PMTiles / Shortbread",
            "attribution": "© OpenStreetMap contributors"
          }
          EOF

      - name: Commit offline OSM package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-assets
          if git diff --cached --quiet; then
            echo "No offline OSM changes to commit."
            exit 0
          fi
          git commit -m "Offline OSM basemap for Crete"
          git push
