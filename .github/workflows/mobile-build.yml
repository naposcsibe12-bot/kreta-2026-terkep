name: Kreta 2026 iOS build

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  ios-project-validation:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: npm ci
      - name: Prepare real Crete offline vector map
        run: bash scripts/prepare-offline-map.sh
      - run: npm run check
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build iOS Simulator app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          mkdir -p artifacts
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/App.app' -type d -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/Kreta-2026-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kreta-2026-iOS-Simulator
          path: mobile/artifacts/Kreta-2026-iOS-Simulator.zip
